<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Action Hub</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, initializeFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        window.SIM2_FB = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, initializeFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch };
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Fragment } = React;
        
        const waitForFirebase = (callback) => {
            if (window.SIM2_FB) callback(window.SIM2_FB);
            else setTimeout(() => waitForFirebase(callback), 50);
        };

        const formatDate = (dateStr) => {
            if (!dateStr) return '---';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr; 
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).replace(/ /g, '-');
        };

        const formatYearStyle = (dateStr) => {
            if (!dateStr) return null;
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return null;
            const year = d.getFullYear();
            const currentYear = 2026;
            const isOld = year < currentYear;
            const formatted = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }).replace(/ /g, '-');
            
            return (
                <span>
                    {formatted}
                    <span className={`text-[10px] ml-1 ${isOld ? 'text-amber-500 font-black' : 'text-slate-400'}`}>-{year}</span>
                </span>
            );
        };

        const calculateDays = (start, end) => {
            if (!start || !end) return '---';
            const diff = new Date(end) - new Date(start);
            return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24))) + ' วัน';
        };

        const GEMINI_MODEL = "gemini-3.1-flash-lite";
        
        const fetchGemini = async (prompt, userKey, systemPrompt = "คุณคือผู้ช่วยจัดการโครงการอุตสาหกรรมมืออาชีพ") => {
            if (!userKey) throw new Error("NO_API_KEY");
            let retries = 0;
            const delays = [1000, 2000, 4000, 8000, 16000];
            while (retries < 5) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${userKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemPrompt }] } })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.error?.message || "API Error");
                    return result.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (error) {
                    if (error.message === "NO_API_KEY") throw error;
                    if (retries === 4) throw error;
                    await new Promise(res => setTimeout(res, delays[retries]));
                    retries++;
                }
            }
        };

        const Icon = ({ name, size = 18, className = "" }) => {
            const icons = {
                Dashboard: <Fragment><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="11" width="7" height="10" rx="1"/><rect x="3" y="15" width="7" height="6" rx="1"/></Fragment>,
                List: <Fragment><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></Fragment>,
                Plus: <Fragment><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Fragment>,
                Search: <Fragment><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Fragment>,
                Trash: <Fragment><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></Fragment>,
                Target: <Fragment><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Fragment>,
                Cloud: <Fragment><path d="M17.5 19c2.5 0 4.5-2 4.5-4.5 0-2.3-1.7-4.2-4-4.5C17.1 6.3 14 4 10.5 4 7.2 4 4.5 6.4 4.1 9.6 1.8 10.1 0 12.1 0 14.5 0 17 2 19 4.5 19h13z"/></Fragment>,
                Menu: <Fragment><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></Fragment>,
                X: <Fragment><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Fragment>,
                Sparkle: <Fragment><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></Fragment>,
                Settings: <Fragment><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></Fragment>,
                Camera: <Fragment><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></Fragment>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || null}</svg>;
        };

        const AiNextStep = ({ title, description, setMsg, fetchGemini, userApiKey, setShowApiKeyModal }) => {
            const [loading, setLoading] = useState(false);
            const [suggestion, setSuggestion] = useState("");
            const getSteps = async () => {
                if (suggestion) { setSuggestion(""); return; }
                if (!userApiKey) { setShowApiKeyModal(true); return; }
                setLoading(true);
                try {
                    const prompt = `งานคือ "${title}". คำอธิบาย: "${description}". ช่วยแนะนำ 3 ขั้นตอนต่อไปเพื่อทำให้งานนี้สำเร็จ เป็นข้อแนะนำสั้นๆ กระชับ ภาษาไทย`;
                    const result = await fetchGemini(prompt, userApiKey, "คุณคือที่ปรึกษาด้านการจัดการโครงการโรงงาน");
                    setSuggestion(result);
                } catch (e) { 
                    if(e.message === "NO_API_KEY") setShowApiKeyModal(true);
                    else setMsg("AI Insight failed: " + e.message); 
                }
                setLoading(false);
            };
            return (
                <div className="flex flex-col items-end w-full">
                    <button onClick={getSteps} disabled={loading} className="text-xs font-bold text-[#3dcd58] flex items-center gap-1.5 hover:text-[#2fa847] transition-colors active:scale-95 disabled:opacity-50">
                        <Icon name="Sparkle" size={14} className={loading ? "animate-spin" : ""} />
                        {suggestion ? "✨ Hide Insights" : "✨ AI Next Steps"}
                    </button>
                    {suggestion && (
                        <div className="mt-3 p-4 bg-gradient-to-r from-[#3dcd58]/10 to-transparent rounded-lg text-xs md:text-sm text-slate-700 italic animate-in w-full text-left whitespace-pre-line border-l-2 border-[#3dcd58]">
                            {suggestion}
                        </div>
                    )}
                </div>
            );
        };

        const SidebarBtn = ({ icon, label, active, onClick }) => (
            <button onClick={onClick} className={`w-full flex items-center gap-3 md:gap-4 px-6 md:px-8 py-3 md:py-4 transition-all duration-300 border-l-4 border-transparent ${active ? 'nav-item-active text-white' : 'text-slate-500 hover:text-white hover:bg-white/5'}`}>
                <span className={active ? 'scale-110' : 'opacity-30'}>{icon}</span>
                <span className="font-bold text-xs md:text-sm uppercase tracking-wider italic leading-none">{label}</span>
            </button>
        );

        const StatCard = ({ label, value, color }) => (
            <div className="bg-white p-6 md:p-10 rounded-[1.5rem] md:rounded-[2.5rem] border border-slate-100 soft-shadow flex flex-col group overflow-hidden relative text-center">
                <div className={`absolute top-0 left-0 w-full h-1.5 md:h-2 ${color} opacity-80 group-hover:h-2.5 transition-all`} />
                <div className="text-3xl md:text-5xl font-black text-slate-800 tracking-tighter italic leading-none tabular-nums mt-2 md:mt-4 mb-1 md:mb-2 group-hover:scale-105 transition-transform origin-center">{value}</div>
                <p className="text-[10px] md:text-xs font-black text-slate-400 uppercase tracking-widest italic">{label}</p>
            </div>
        );

        const FormInput = ({ label, val, onChange, placeholder, type="text" }) => (
            <div className="space-y-1">
                <label className="text-[10px] md:text-xs font-bold text-slate-400 uppercase italic ml-1">{label}</label>
                <input type={type} className="w-full p-2.5 md:p-3 bg-slate-50 border border-slate-100 rounded-xl text-xs md:text-sm font-bold italic uppercase outline-none focus:border-[#3dcd58] transition shadow-sm" placeholder={placeholder} value={val} onChange={(e) => onChange(e.target.value)} />
            </div>
        );

        const DetailRow = ({ label, val }) => (
            <div className="bg-white p-3 md:p-4 rounded-xl border border-slate-100 shadow-sm flex flex-col gap-0.5 md:gap-1 overflow-hidden">
                <span className="text-[10px] md:text-xs font-black text-slate-400 uppercase italic leading-none tracking-widest">{label}</span>
                <span className="text-xs md:text-sm font-bold text-slate-700 italic leading-tight pr-1 break-words">{val || '---'}</span>
            </div>
        );

        const App = ({ fb }) => {
            const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, initializeFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch, getFirestore } = fb;
            
            const firebaseConfig = {
              apiKey: "AIzaSyBpb35n86yKm-etaqI9ilvPosBe4OyDogs",
              authDomain: "sim2-management-rattanachot.firebaseapp.com",
              projectId: "sim2-management-rattanachot",
              storageBucket: "sim2-management-rattanachot.firebasestorage.app",
              messagingSenderId: "1050876853626",
              appId: "1:1050876853626:web:a9cfa2b91416426a686ac3",
              measurementId: "G-KE7P699K7N"
            };

            const app = useMemo(() => initializeApp(firebaseConfig), []);
            const auth = useMemo(() => getAuth(app), [app]);
            const db = useMemo(() => {
                try {
                    return initializeFirestore(app, { experimentalForceLongPolling: true });
                } catch(e) {
                    return getFirestore(app);
                }
            }, [app]);
            
            const appId = 'sim2-mgmt-rattanachot';

            const [user, setUser] = useState(null);
            const [allData, setAllData] = useState([]);
            const [meta, setMeta] = useState(null);
            const [view, setView] = useState('dashboard');
            const [search, setSearch] = useState('');
            const [statusFilter, setStatusFilter] = useState('All');
            const [lineFilter, setLineFilter] = useState('All'); 
            const [expandedId, setExpandedId] = useState(null);
            const [msg, setMsg] = useState(null);
            const [syncProgress, setSyncProgress] = useState(null);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);

            const [editingCostId, setEditingCostId] = useState(null);
            const [tempCost, setTempCost] = useState('');

            const [userApiKey, setUserApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
            const [showApiKeyModal, setShowApiKeyModal] = useState(false);
            const [tempApiKey, setTempApiKey] = useState('');

            const [aiSummary, setAiSummary] = useState("");
            const [isAiLoading, setIsAiLoading] = useState(false);

            const [newItem, setNewItem] = useState({
                'Action Id': '', 'Title': '', 'Description': '', 'Cost': '', 'Opening Date': new Date().toISOString(), 'Status': 'Open', 'In_Charge': 'Rattanachot Siriwanit', 'Line': '' 
            });
            const publicPath = ['artifacts', appId, 'public', 'data'];

            useEffect(() => {
                signInAnonymously(auth).catch(console.error);
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, [auth]);

            useEffect(() => {
                if (!user) return;
                const actionsCol = collection(db, ...publicPath, 'actions');
                const unsubData = onSnapshot(actionsCol, (snap) => setAllData(snap.docs.map(doc => ({ ...doc.data(), _id: doc.id }))));
                const metaDoc = doc(db, ...publicPath, 'metadata', 'sync_info');
                const unsubMeta = onSnapshot(metaDoc, (docSnap) => { if (docSnap.exists()) setMeta(docSnap.data()); });
                return () => { unsubData(); unsubMeta(); };
            }, [user, db]);

            useEffect(() => setIsSidebarOpen(false), [view]);

            const lineOptions = useMemo(() => {
                const counts = {};
                const myTasks = allData.filter(t => {
                    const nameFields = String(t.In_Charge || t.Owner || t.Raiser || t.Responsible || t.OwnerName || t.Rattanachot || '').toLowerCase();
                    return nameFields.includes('rattanachot') || nameFields.includes('siriwanit') || nameFields.includes('รัตนโชติ');
                });

                myTasks.forEach(t => {
                    const line = t.Line || t.Area || 'Unknown';
                    const status = String(t.Status || '').toLowerCase();
                    if (status.includes('open')) {
                        counts[line] = (counts[line] || 0) + 1;
                    }
                });

                return Object.entries(counts)
                    .map(([name, count]) => ({ name, count }))
                    .sort((a, b) => b.count - a.count);
            }, [allData]);

            const filteredTasks = useMemo(() => {
                let tasks = allData.filter(t => {
                    const nameFields = String(t.In_Charge || t.Owner || t.Raiser || t.Responsible || t.OwnerName || t.Rattanachot || '').toLowerCase();
                    const isMe = nameFields.includes('rattanachot') || nameFields.includes('siriwanit') || nameFields.includes('รัตนโชติ');
                    const matchSearch = Object.values(t).some(v => String(v).toLowerCase().includes(search.toLowerCase()));
                    return isMe && matchSearch;
                });

                if (statusFilter !== 'All') {
                    const sf = statusFilter.toLowerCase();
                    tasks = tasks.filter(t => {
                         const s = String(t.Status || '').toLowerCase();
                         if (sf === 'in progress') return s.includes('progress');
                         return s.includes(sf);
                    });
                }

                if (lineFilter !== 'All') {
                    tasks = tasks.filter(t => (t.Line || t.Area || 'Unknown') === lineFilter);
                }

                return tasks.sort((a, b) => {
                    const statusA = (a.Status || '').toLowerCase();
                    const statusB = (b.Status || '').toLowerCase();
                    const isClosedA = statusA.includes('closed');
                    const isClosedB = statusB.includes('closed');
                    if (isClosedA && !isClosedB) return 1;
                    if (!isClosedA && isClosedB) return -1;
                    const dateA = new Date(a['Opening Date'] || a.OpenedAt || 0);
                    const dateB = new Date(b['Opening Date'] || b.OpenedAt || 0);
                    return dateB - dateA;
                });
            }, [allData, search, statusFilter, lineFilter]);

            const stats = useMemo(() => {
                const total = filteredTasks.length;
                const open = filteredTasks.filter(t => {
                    const s = String(t.Status || '').toLowerCase();
                    return s === 'open' || s.includes('open');
                }).length;
                const closed = filteredTasks.filter(t => {
                     const s = String(t.Status || '').toLowerCase();
                     return s.includes('closed') || s === 'close';
                }).length;
                const progress = filteredTasks.filter(t => {
                     const s = String(t.Status || '').toLowerCase();
                     return s.includes('progress') || s === 'in progress';
                }).length;
                return { total, open, closed, progress };
            }, [filteredTasks]);

            const costData = useMemo(() => {
                const months2026 = Array(12).fill(0);
                const closedItems2026 = Array(12).fill(0); // ตัวแปรเก็บจำนวน Item ที่ปิด
                const currentYear = 2026;
                let totalSpent2026 = 0;
                let totalClosed2026 = 0;

                filteredTasks.forEach(t => {
                    // ใช้ Closure Date ตัดสินว่างานนี้ตกอยู่ในเดือนไหน
                    const targetDateStr = t['Closure Date'] || t.ClosedAt || t['Due Date'] || t['Due Date R/S*'] || t['Opening Date'] || t.OpenedAt || new Date().toISOString();
                    const d = new Date(targetDateStr);
                    
                    if (!isNaN(d) && d.getFullYear() === currentYear) {
                        const month = d.getMonth();
                        const status = String(t.Status || '').toLowerCase();
                        
                        // ถ้าระบุว่ามี Cost ก็บวกเงินเข้าไป
                        const costStr = String(t.Cost || t.Budget || '0').replace(/[^0-9.-]+/g, "");
                        const cost = parseFloat(costStr) || 0;
                        if (cost > 0) {
                            months2026[month] += cost;
                            totalSpent2026 += cost;
                        }

                        // ถ้างบถูกปิด (Closed) ให้นับจำนวนงานไว้ด้วย
                        if (status.includes('closed') || status === 'close') {
                            closedItems2026[month] += 1;
                            totalClosed2026 += 1;
                        }
                    }
                });

                const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const maxVal = Math.max(...months2026, 1);
                
                return {
                    chart: months2026.map((val, idx) => ({
                        label: monthNames[idx],
                        val,
                        closedCount: closedItems2026[idx],
                        // ถ้ามีเงินให้ยืดกราฟตามเงิน, ถ้าไม่มีเงินแต่มีงานปิด ให้ยืดกราฟมารอรับป้ายไว้ 4% (เนียนๆ)
                        height: val > 0 ? Math.max((val / maxVal) * 100, 4) : (closedItems2026[idx] > 0 ? 4 : 0)
                    })),
                    totalSpent: totalSpent2026,
                    totalClosed: totalClosed2026
                };
            }, [filteredTasks]);

            const saveApiKey = () => {
                localStorage.setItem('gemini_api_key', tempApiKey);
                setUserApiKey(tempApiKey);
                setShowApiKeyModal(false);
                setMsg("API Key Saved Local!");
            };

            const clearApiKey = () => {
                localStorage.removeItem('gemini_api_key');
                setUserApiKey('');
                setTempApiKey('');
            };

            const handleGenerateSummary = async () => {
                if (filteredTasks.length === 0) return;
                if (!userApiKey) { setShowApiKeyModal(true); return; }
                setIsAiLoading(true);
                try {
                    const openTasks = filteredTasks.filter(t => {
                        const s = String(t.Status || '').toLowerCase();
                        return s.includes('open') || s.includes('progress');
                    });
                    
                    const lineAnalysis = {};
                    openTasks.forEach(t => {
                        const line = t.Line || t.Area || 'Unknown';
                        if (!lineAnalysis[line]) lineAnalysis[line] = { count: 0, actions: [] };
                        lineAnalysis[line].count += 1;
                        const shortDesc = t.Description ? t.Description.replace(/\n/g, ' ').substring(0, 100) : 'ไม่มีรายละเอียด';
                        lineAnalysis[line].actions.push(`- [${t.Status}] ${t.Title} (ข้อมูล: ${shortDesc}...)`);
                    });

                    let dataForAi = "";
                    const sortedLines = Object.entries(lineAnalysis).sort((a, b) => b[1].count - a[1].count);
                    
                    sortedLines.slice(0, 5).forEach(([line, data]) => {
                        dataForAi += `Line: ${line} (ค้างอยู่: ${data.count} items)\n${data.actions.join('\n')}\n\n`;
                    });

                    if (sortedLines.length > 5) {
                        let remainingCount = 0;
                        sortedLines.slice(5).forEach(([_, data]) => {
                            remainingCount += data.count;
                        });
                        dataForAi += `\nนอกจากนี้ ยังมีงานค้างกระจายอยู่ตาม Line อื่นๆ อีกรวม ${remainingCount} items`;
                    }

                    const prompt = `จากข้อมูลงานค้างหน้างาน (Open/In Progress) แยกตาม Line ด้านล่างนี้:
\n${dataForAi}
คุณคือพี่เลี้ยงวิศวกร ให้เขียน "ไกด์ไลน์การปฏิบัติงานจริง" ให้คนหน้างานเอาไปทำต่อได้เลย โดย:
1. เลือก Line ที่วิกฤติที่สุด ระบุจำนวน Item
2. แนะนำวิธีแก้ปัญหา "ระดับปฏิบัติการ (Actionable)" ให้กับปัญหาหลักๆ ของ Line นั้น (อ้างอิงจาก Title และข้อมูลงาน) แนะนำเลยว่าต้องไปเช็คอะไร ปรับตั้งค่าตรงไหน ประสานงานใคร

                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const cleanText = ev.target.result.replace(/^\uFEFF/, '').trim();
                        const parseCSV = (text) => {
                            const lines = text.split('\n');
                            const delimiter = lines[0].indexOf(';') !== -1 ? ';' : ',';
                            return lines.map(line => {
                                const row = [];
                                let cur = '', inQuote = false;
                                for (let i = 0; i < line.length; i++) {
                                    const char = line[i];
                                    if (char === '"') inQuote = !inQuote;
                                    else if (char === delimiter && !inQuote) { row.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
                                    else cur += char;
                                }
                                row.push(cur.trim().replace(/^"|"$/g, ''));
                                return row;
                            });
                        };
                        const rows = parseCSV(cleanText);
                        const hIdx = rows.findIndex(r => r.some(c => String(c).toLowerCase().includes('id')));
                        const headers = rows[hIdx].map(h => h.trim());
                        let idIdx = headers.findIndex(h => h.toLowerCase() === 'action id');
                        if (idIdx === -1) idIdx = headers.findIndex(h => h.toLowerCase().includes('id'));
                        const dataRows = rows.slice(hIdx + 1).filter(r => r[idIdx]);
                        const batchLimit = 300; 
                        let successCount = 0;
                        for (let i = 0; i < dataRows.length; i += batchLimit) {
                            const chunk = dataRows.slice(i, i + batchLimit);
                            const batch = writeBatch(db);
                            chunk.forEach(r => {
                                const cleanId = String(r[idIdx]).toUpperCase().replace(/[^a-zA-Z0-9-]/g, '-').trim();
                                if (cleanId.length > 1) {
                                    const obj = { Source: 'SIM2' };
                                    headers.forEach((h, idx) => { if (h && r[idx] !== undefined) obj[h.replace(/[./*\[\]#$]/g, '_')] = r[idx]; });
                                    batch.set(doc(db, ...publicPath, 'actions', cleanId), obj, { merge: true });
                                    successCount++;
                                }
                            });
                            await batch.commit();
                        }
                        await setDoc(doc(db, ...publicPath, 'metadata', 'sync_info'), { lastUpload: new Date().toISOString() }, { merge: true });

                                            <div className="p-20 text-center text-slate-300 font-bold uppercase italic text-sm">No data found</div>
                                        ) : filteredTasks.map(t => (
                                            <div key={t._id} className="group flex flex-col">
                                                <div onClick={() => setExpandedId(expandedId === t._id ? null : t._id)} className={`p-5 md:p-6 flex items-center justify-between cursor-pointer hover:bg-slate-50 transition-colors ${expandedId === t._id ? 'bg-[#3dcd58]/5' : ''}`}>
                                                    <div className="flex items-center gap-4 md:gap-8 min-w-0 flex-1">
                                                        <div className="flex flex-col shrink-0 w-20 md:w-28">
                                                            <span className={`text-[10px] md:text-xs font-black italic uppercase mb-1 ${t.Source === 'Manual Entry' ? 'text-amber-500' : 'text-[#3dcd58]'}`}>{t.Source || 'SIM2'}</span>
                                                            <span className="text-xs font-bold text-slate-400 italic">ID: {t['Action Id']?.slice(-10)}</span>
                                                        </div>
                                                        <h4 className={`text-sm md:text-base font-bold italic uppercase pr-1 tracking-tight leading-tight transition-colors ${t.Status?.toLowerCase().includes('closed') ? 'text-slate-400 line-through' : 'text-slate-700 group-hover:text-[#3dcd58]'}`}>{t.Title || 'Untitled Action'}</h4>
                                                    </div>
                                                    <div className="flex items-center gap-3 md:gap-5 shrink-0">
                                                        <div className={`px-3 md:px-4 py-1.5 md:py-2 rounded text-[10px] md:text-xs font-black uppercase italic tracking-widest ${t.Status?.toLowerCase().includes('open') ? 'bg-amber-100 text-amber-700' : t.Status?.toLowerCase().includes('progress') ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-500'}`}>{t.Status?.split(' ')[0]}</div>
                                                        <button onClick={(e) => { e.stopPropagation(); setDeleteConfirm({ type: 'single', id: t._id }); }} className="p-2 text-slate-200 hover:text-rose-500 transition-colors"><Icon name="Trash" size={16} /></button>
                                                    </div>
                                                </div>
                                                <div className={`overflow-hidden transition-all duration-300 ${expandedId === t._id ? 'max-h-[1500px] border-t border-slate-50' : 'max-h-0'}`}>
                                                    <div className="p-5 md:p-10 grid grid-cols-1 lg:grid-cols-2 gap-6 md:gap-8">
                                                        <div className="space-y-4 md:space-y-6">
                                                            <div className="p-5 bg-white border italic text-slate-600 text-xs md:text-sm whitespace-pre-wrap leading-relaxed shadow-sm border-l-4 border-[#3dcd58]">
                                                                {t.Description || '--- NO DETAIL ---'}
                                                                <div className="mt-5 pt-5 border-t border-slate-100"><AiNextStep title={t.Title} description={t.Description} setMsg={setMsg} fetchGemini={fetchGemini} userApiKey={userApiKey} setShowApiKeyModal={setShowApiKeyModal}/></div>
                                                            </div>
                                                            <div className="grid grid-cols-1 xs:grid-cols-3 gap-3 md:gap-4">
                                                                <DetailRow label="Raiser" val={t.Raiser || t.In_Charge} />
                                                                <DetailRow label="Line name" val={t.Line || t.Area} />
                                                                <div className="bg-white p-3 md:p-4 rounded-xl border border-slate-100 shadow-sm flex flex-col gap-1 cursor-text group/cost relative" onClick={() => { setEditingCostId(t._id); setTempCost(t.Cost || t.Budget || ''); }}>
                                                                    <span className="text-[10px] md:text-xs font-black text-[#3dcd58] uppercase italic flex items-center justify-between">
                                                                        Cost (THB)
                                                                        {editingCostId !== t._id && <span className="opacity-0 group-hover/cost:opacity-100 text-[9px] text-slate-300">Edit</span>}
                                                                    </span>
                                                                    {editingCostId === t._id ? (
                                                                        <input autoFocus className="w-full text-xs md:text-sm font-bold text-slate-700 italic outline-none border-b border-[#3dcd58] bg-transparent" value={tempCost} onChange={(e) => setTempCost(e.target.value)} onBlur={() => saveCostEdit(t._id)} onKeyDown={(e) => { if(e.key === 'Enter') saveCostEdit(t._id) }} />
                                                                    ) : (
                                                                        <span className="text-xs md:text-sm font-bold text-slate-700 italic break-words">{t.Cost || t.Budget || '---'}</span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                            <div className="grid grid-cols-2 xs:grid-cols-4 gap-3 md:gap-4">
                                                                <div className="bg-white p-3 md:p-4 rounded-xl border border-slate-100 shadow-sm flex flex-col gap-1"><span className="text-[10px] md:text-xs font-black text-slate-400 uppercase italic">Date</span><span className="text-xs md:text-sm font-bold text-slate-700">{formatYearStyle(t['Opening Date'])}</span></div>
                                                                <div className="bg-white p-3 md:p-4 rounded-xl border border-slate-100 shadow-sm flex flex-col gap-1"><span className="text-[10px] md:text-xs font-black text-slate-400 uppercase italic">Start</span><span className="text-xs md:text-sm font-bold text-slate-700">{formatYearStyle(t.OpenedAt)}</span></div>
                                                                <div className="bg-white p-3 md:p-4 rounded-xl border border-slate-100 shadow-sm flex flex-col gap-1"><span className="text-[10px] md:text-xs font-black text-slate-400 uppercase italic">Success</span><span className="text-xs md:text-sm font-bold text-slate-700">{formatYearStyle(t.ClosedAt)}</span></div>
                                                                <DetailRow label="Days Taken" val={calculateDays(t.OpenedAt, t.ClosedAt)} />
                                                            </div>
                                                        </div>
                                                        <div className="flex flex-col gap-4">
                                                            <div className="flex-1 flex flex-col gap-2">
                                                                <h5 className="text-[10px] md:text-xs font-bold text-[#3dcd58] uppercase tracking-widest italic mb-1 ml-1">Follow-up Summary</h5>
                                                                <textarea className="w-full flex-1 p-4 md:p-5 bg-white border border-slate-200 rounded-xl text-xs md:text-sm outline-none shadow-sm focus:border-[#3dcd58] transition italic h-24 md:h-auto" placeholder="Type summary here..." value={t.Note || ''} onChange={async (e) => await setDoc(doc(db, ...publicPath, 'actions', t._id), { Note: e.target.value }, { merge: true })} />
                                                                
                                                                {t.Image && (
                                                                    <div className="relative w-full h-32 md:h-48 rounded-xl overflow-hidden border border-slate-200 shadow-sm group/img mt-2">
                                                                        <img src={t.Image} alt="Action Attachment" className="w-full h-full object-cover" />
                                                                        <button onClick={async () => await setDoc(doc(db, ...publicPath, 'actions', t._id), { Image: null }, { merge: true })} className="absolute top-2 right-2 p-1.5 bg-rose-500/80 hover:bg-rose-600 text-white rounded-full opacity-0 group-hover/img:opacity-100 transition-opacity">
                                                                            <Icon name="X" size={14} />
                                                                        </button>
                                                                    </div>
                                                                )}
                                                                
                                                                <label className="cursor-pointer flex items-center justify-center gap-2 w-full py-2 mt-1 bg-slate-50 border border-dashed border-slate-300 text-slate-500 rounded-lg text-[10px] md:text-xs font-bold hover:bg-slate-100 hover:border-[#3dcd58] hover:text-[#3dcd58] transition active:scale-95">
                                                                    <Icon name="Camera" size={14} /> แนบรูปถ่ายหน้างาน
                                                                    <input type="file" accept="image/*" className="hidden" onChange={(e) => handleImageUpload(e, t._id)} />
                                                                </label>
                                                            </div>
                                                            <button onClick={async () => {
                                                                const s = (t.Status || '').toLowerCase();
                                                                const next = s.includes('open') ? 'In Progress' : s.includes('progress') ? 'Closed' : 'Open';
                                                                const up = { Status: next };
                                                                if (next === 'Closed') { up.ClosedAt = new Date().toISOString(); if (!t.OpenedAt) up.OpenedAt = new Date().toISOString(); }
                                                                else if (next === 'In Progress') { up.OpenedAt = t.OpenedAt || new Date().toISOString(); up.ClosedAt = null; }
                                                                else { up.OpenedAt = null; up.ClosedAt = null; }
                                                                await setDoc(doc(db, ...publicPath, 'actions', t._id), up, { merge: true });
                                                            }} className="w-full py-4 bg-slate-800 text-white rounded-lg font-bold uppercase italic hover:bg-[#3dcd58] transition-all text-xs md:text-sm tracking-widest">Cycle Status</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {deleteConfirm && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl p-8 md:p-10 max-w-sm w-full shadow-2xl text-center animate-in border border-slate-100">
                                <h3 className="text-lg md:text-xl font-bold uppercase italic text-slate-800 mb-2">Confirm Delete</h3>
                                <p className="text-slate-400 font-medium italic text-xs md:text-sm mb-8">Permanently remove this action from cloud storage?</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteConfirm(null)} className="flex-1 py-3 bg-slate-50 text-slate-400 rounded font-bold uppercase text-xs">Abort</button>
                                    <button onClick={confirmDelete} className="flex-1 py-3 bg-rose-600 text-white rounded font-bold uppercase text-xs shadow-lg">Delete</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showApiKeyModal && (
                        <div className="fixed inset-0 z-[300] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl p-6 md:p-10 max-w-md w-full shadow-2xl animate-in border border-slate-100">
                                <h3 className="text-lg md:text-xl font-black uppercase italic text-slate-800 mb-2 flex items-center gap-2"><Icon name="Settings" size={20}/> Gemini API Setup</h3>
                                <p className="text-slate-500 font-medium italic text-xs md:text-sm mb-6">วาง API Key ของคุณที่นี่เพื่อเปิดใช้งานฟีเจอร์ AI</p>
                                <input type="password" placeholder="AIzaSy..." className="w-full p-4 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:border-[#3dcd58] transition mb-6 font-mono" value={tempApiKey} onChange={e => setTempApiKey(e.target.value)} />
                                <div className="flex gap-3">
                                    <button onClick={() => setShowApiKeyModal(false)} className="py-3 px-5 bg-slate-100 text-slate-500 rounded font-bold uppercase text-xs">Cancel</button>
                                    <button onClick={clearApiKey} className="py-3 px-5 bg-rose-50 text-rose-500 rounded font-bold uppercase text-xs mr-auto">Clear</button>
                                    <button onClick={saveApiKey} className="py-3 px-6 bg-[#3dcd58] text-white rounded font-bold uppercase text-xs shadow-lg">Save</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        waitForFirebase((fb) => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App fb={fb} />);
        });
    </script>
</body>
</html>
